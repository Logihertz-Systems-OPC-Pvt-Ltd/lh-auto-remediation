[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-auto-remediation"
version = "0.1.0"
description = "Parses security audit findings and vulnerable configuration manifests (SSH, Nginx, Docker, Terraform, sysctl) to deterministically generate hardened drop-in replacements and unified Git diff remediation patches."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "auto-remediation",
    "security-hardening",
    "git-patch",
    "devsecops",
    "configuration-management",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-auto-remediation"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-auto-remediation"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-auto-remediation#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-auto-remediation/issues"

[project.scripts]
lh-remediate = "lh_auto_remediation.cli:app"
lh-auto-remediation = "lh_auto_remediation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_auto_remediation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

